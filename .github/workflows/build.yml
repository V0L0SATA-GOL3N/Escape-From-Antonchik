name: Build

# Builds the game for Windows, macOS and Linux using GameCI.
# Can be triggered three ways:
#   1. Pushing a version tag (e.g. v1.2.0)         -> builds that tag
#   2. Called from version-bump.yml (workflow_call) -> builds the freshly created tag
#   3. Manually from the Actions tab (workflow_dispatch)
#
# Requires the following repository secrets (Settings -> Secrets -> Actions):
#   UNITY_LICENSE  - contents of your Unity .ulf license file (Personal license)
#   UNITY_EMAIL    - your Unity account email
#   UNITY_PASSWORD - your Unity account password
# See README/instructions printed after setup for how to obtain UNITY_LICENSE.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag/branch/sha) to build'
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (tag) to build'
        required: false
        type: string
        default: ''
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneOSX
          - StandaloneLinux64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}

      - name: Package artifact
        run: |
          cd build
          zip -r "../EscapeFromAntonchik-${{ matrix.targetPlatform }}.zip" "${{ matrix.targetPlatform }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeFromAntonchik-${{ matrix.targetPlatform }}
          path: EscapeFromAntonchik-${{ matrix.targetPlatform }}.zip
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a GitHub Release when building an actual tag.
    if: startsWith(inputs.ref || github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag name
        id: tag
        run: |
          REF="${{ inputs.ref || github.ref_name }}"
          # Strip refs/tags/ prefix if present
          TAG="${REF#refs/tags/}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Escape From Antonchik ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: artifacts/*.zip
