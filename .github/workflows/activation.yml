name: Acquire Unity Activation File

# One-time helper to get your Unity Personal license for CI.
# Run it once (Actions -> Acquire Unity Activation File -> Run workflow), then:
#   1. Download the "Unity_v20XX.alf" artifact from the run.
#   2. Go to https://license.unity3d.com/manual and upload the .alf file.
#   3. Download the resulting Unity_v20XX.ulf file.
#   4. Copy its FULL contents into a repo secret named UNITY_LICENSE
#      (Settings -> Secrets and variables -> Actions -> New repository secret).
# Also add UNITY_EMAIL and UNITY_PASSWORD secrets (your Unity account).

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
